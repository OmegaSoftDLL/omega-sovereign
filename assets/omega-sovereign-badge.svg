<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#132a4a"/>
      <stop offset="65%" stop-color="#0a1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <style>
      .orbit { transform-origin: 80px 80px; animation: spin 14s linear infinite; }
      .pulse { animation: glowPulse 3s ease-in-out infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes glowPulse { 0%, 100% { opacity: 0.82; } 50% { opacity: 1; } }
    </style>
  </defs>

  <circle cx="80" cy="80" r="74" fill="url(#core)" stroke="url(#ring)" stroke-width="3.5"/>
  <g class="orbit">
    <circle cx="80" cy="80" r="64" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="10 8" opacity="0.75"/>
    <circle cx="80" cy="16" r="4" fill="#10b981"/>
    <circle cx="144" cy="80" r="4" fill="#38bdf8"/>
    <circle cx="80" cy="144" r="4" fill="#a855f7"/>
  </g>

  <g class="pulse">
    <text x="58" y="95" text-anchor="middle" font-family="'Segoe UI', Georgia, serif" font-weight="800" font-size="52" fill="#10b981">Ω</text>
    <text x="106" y="95" text-anchor="middle" font-family="'Segoe UI', Georgia, serif" font-weight="800" font-size="46" fill="#38bdf8">λ</text>
  </g>

  <rect x="30" y="110" width="100" height="20" rx="10" fill="#091526" stroke="#10b981" stroke-width="1"/>
  <text x="80" y="124" text-anchor="middle" font-family="'Cascadia Code', Consolas, monospace" font-weight="700" font-size="10" fill="#e2e8f0">OMEGA · LUME</text>
</svg>
