<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="lumiBadgeTitle lumiBadgeDesc">
  <title id="lumiBadgeTitle">Lumi — Official Lume Bioluminescent Crystal Chameleon Mascot &amp; Crest</title>
  <desc id="lumiBadgeDesc">Harmonized vector crest featuring Lumi, the faceted bioluminescent crystal chameleon curled around the Lume lambda prism with cyan, emerald, violet, and solar-amber glow on a transparent exterior canvas.</desc>

  <defs>
    <radialGradient id="lumiAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="medallionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1326"/>
      <stop offset="55%" stop-color="#070C18"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="medallionRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="40%" stop-color="#34D399"/>
      <stop offset="75%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FFAA4D"/>
    </linearGradient>
    <linearGradient id="bodyCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="crestVioletCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="tailAmberViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#FFAA4D"/>
    </linearGradient>
    <linearGradient id="lambdaGoldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFAA4D"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes pulseCrest {
        0%, 100% { opacity: 0.92; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      .lumi-pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulseCrest 4s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .lumi-pulse { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Feathered Transparent Outer Bioluminescent Aura (Zero Rectangular Box Edges) -->
  <circle cx="80" cy="80" r="78" fill="url(#lumiAura)"/>

  <!-- Obsidian Glass Circular Medallion with Prismatic Chameleon Rim -->
  <circle cx="80" cy="80" r="64" fill="url(#medallionBg)" stroke="url(#medallionRim)" stroke-width="2.5"/>
  <circle cx="80" cy="80" r="58" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Subtle Hex/Crystal Grid Inside Medallion -->
  <g stroke="#1E293B" stroke-width="0.8" opacity="0.55" fill="none">
    <polygon points="80,26 126,53 126,107 80,134 34,107 34,53"/>
    <line x1="80" y1="26" x2="80" y2="134"/>
    <line x1="34" y1="53" x2="126" y2="107"/>
    <line x1="126" y1="53" x2="34" y2="107"/>
  </g>

  <g class="lumi-pulse" filter="url(#softGlow)">
    <!-- Spiraling Prehensile Chameleon Tail (Bottom-Left to Bottom-Right, Amber/Violet/Emerald Facets) -->
    <path d="M 48 92 C 36 108, 46 128, 70 130 C 94 132, 114 118, 112 98 C 110 84, 96 80, 88 88 C 82 94, 86 104, 94 102"
          fill="none" stroke="url(#tailAmberViolet)" stroke-width="8.5" stroke-linecap="round"/>
    <path d="M 52 94 C 42 108, 50 124, 70 126 C 90 128, 108 116, 106 98"
          fill="none" stroke="#FEF08A" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

    <!-- Faceted Crystal Chameleon Dorsal Arch & Body (Left-to-Top-Right) -->
    <polygon points="38,84 46,60 68,46 92,50 82,72 56,88" fill="url(#bodyCyanEmerald)" stroke="#E0F2FE" stroke-width="1.1"/>
    <!-- Crystal Facet Lines on Body -->
    <polyline points="46,60 66,68 68,46" fill="none" stroke="#BAE6FD" stroke-width="1.1" opacity="0.85"/>
    <polyline points="56,88 66,68 82,72" fill="none" stroke="#6EE7B7" stroke-width="1.1" opacity="0.85"/>
    <!-- Dorsal Bioluminescent Spines -->
    <polygon points="44,56 50,46 56,53" fill="#38BDF8"/>
    <polygon points="58,48 65,37 71,45" fill="#34D399"/>
    <polygon points="73,45 81,36 86,46" fill="#A855F7"/>

    <!-- Chameleon Casque (Crowned Crystal Head on Top-Right) -->
    <polygon points="82,50 104,34 118,48 126,66 106,76 86,68" fill="url(#crestVioletCyan)" stroke="#E0F2FE" stroke-width="1.2"/>
    <polygon points="92,46 104,34 114,50 100,56" fill="#38BDF8" opacity="0.55"/>
    <polygon points="106,76 126,66 120,76 104,80" fill="#10B981" opacity="0.85"/>

    <!-- Expressive Turret Eye (Solar Amber & Cyan Ring) -->
    <circle cx="107" cy="57" r="7.5" fill="#050811" stroke="#FFAA4D" stroke-width="2.2"/>
    <circle cx="107" cy="57" r="3.6" fill="#00D2FF"/>
    <circle cx="109" cy="55" r="1.6" fill="#FFFFFF"/>

    <!-- Forelimb Clasping the Central Lambda (λ) Crystal -->
    <path d="M 64 80 L 74 88 L 80 84" fill="none" stroke="#34D399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Central Glowing Lume Lambda (λ) Sovereign Core -->
    <g transform="translate(0, 2)">
      <path d="M 66 56 L 78 56 L 98 106 L 88 106 L 79 83 L 68 106 L 58 106 L 74 72 L 66 56 Z"
            fill="url(#lambdaGoldCyan)" stroke="#FFFFFF" stroke-width="1"/>
    </g>

    <!-- Floating Verification Sparkles -->
    <circle cx="34" cy="44" r="2.2" fill="#38BDF8"/>
    <circle cx="128" cy="42" r="2.5" fill="#FFAA4D"/>
    <circle cx="126" cy="96" r="2.0" fill="#34D399"/>
    <circle cx="32" cy="104" r="1.8" fill="#A855F7"/>
  </g>
</svg>
